[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "coreot"
version = "0.1.0"
description = "CoRe-OT: prior-informed unbalanced optimal transport for weak-correspondence scoring."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "CoRe-OT contributors"}]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scipy>=1.9",
  "scikit-learn>=1.2",
  "matplotlib>=3.6",
  "PyYAML>=6.0",
  "tabulate>=0.10.0",
  "anndata>=0.11.4",
  "pyarrow>=15",
  "scanpy>=1.10",
  "celltypist>=1.7",
  "pertpy>=1.0.3",
  "filelock>=3.29.5",
]

[project.scripts]
coreot = "coreot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
embeddings = [
  "anndata>=0.9",
  "scanpy>=1.10",
  "harmonypy>=0.0.9",
  "scanorama>=1.7",
]
mouse-spleen-provider = [
  "MultiMAP @ git+https://github.com/Teichlab/MultiMAP.git@681e608c45cdb6b139dfb6700e40c7520bc6096d",
]
external-baselines = [
  "pot>=0.9.1,<0.10",
  "scvi-tools>=1.3",
]

[dependency-groups]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/coreot"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
# [tool.uv]
# index-url = "https://pypi.org/simple/"
